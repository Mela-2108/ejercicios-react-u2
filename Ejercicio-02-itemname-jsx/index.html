<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La Heladería</title>
    <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>

</head>

<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React from "https://esm.sh/react@19.2.0?dev";
        import { createRoot } from "https://esm.sh/react-dom@19.2.0/client?dev";

        const menu = (
            <>
            <main>
                <h1>La Heladería</h1>
                <article className ="menu-item">
                    <h2>Mora silvestre</h2>
                    <p className="menu-item-description">
                        Mora de Ambato con un toque de limon.</p>
                </article>
                <article className="menu-item">
                        <h2>Taxo con crema</h2>
                        <p className="menu-item-description">
                            Helado artesanal de taxo fresco.
                        </p>
                    </article>
                </main>
                <footer>
                    <p>La Heladería Ambato</p>
                </footer>
            </>
        )

        createRoot(document.getElementById("root")).render(menu);
    </script>
</body>

</html>
